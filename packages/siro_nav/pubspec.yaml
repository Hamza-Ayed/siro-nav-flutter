name: siro_nav
description: >
  Premium Flutter Turn-by-Turn Navigation SDK for Siro Maps Platform (Jordan, Syria & MENA).
  Features Drop-in UI Widget (SiroNavView), Background Location Resilience,
  API Key Gated Licensing, and Live Fleet Telemetry.
version: 0.1.0
homepage: https://intaleqapp.com
repository: https://github.com/Hamza-Ayed/map-saas

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  siro_nav_core:
    path: ../siro_nav_core
  siro_map:
    path: ../siro_map
  geolocator: ^14.0.3
  permission_handler: ^13.0.2
  flutter_svg: ^2.3.0
  http: ^1.2.0
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/ar/
    - assets/map_icons/
